name: xstudio-l2-tools
version: "1.0.0"
description: "Small typed XStudio L2 investigation tools. Registers named xstudio_* tools in the xstudio_l2 toolset and owns Windows/WSL/pyodbc transport, credentials, read-only enforcement, allowlisted diagnostic procedures, output budgets, call budgets, and repeated-failure guards. Also blocks the retired terminal SQL transport (Hermes_Orchestrator.py / Windows Python / sqlcmd / pyodbc / pip)."
author: Snehil Bhadkamkar, Hermes Agent
requires_env: []
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
provides_tools:
  - xstudio_get_ticket_context
  - xstudio_get_run_actions
  - xstudio_save_ledger
  - xstudio_read_table
  - xstudio_heat_context
  - xstudio_sap_api_context
  - xstudio_work_order_context
  - xstudio_submit_proposal
