name: xstudio-l2-trace
version: "1.1.0"
description: "Writes every tool call the L2 investigator/reviewer bots make, plus LM Studio/GPU hardware samples at session start/end, to a local JSONL trace log, drained into XStudio_Helpdesk.Hermes_Agent_Trace_Trn_Tbl by a separate cron job. No external service, no credentials -- traces land in Helpdesk itself, not a third-party SaaS. Every event carries run_id/ticket_id so per-ticket compute usage is directly queryable."
author: AI Helpdesk / Hermes L2 project
requires_env: []
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - post_api_request
  - api_request_error
  - on_session_start
  - on_session_end
