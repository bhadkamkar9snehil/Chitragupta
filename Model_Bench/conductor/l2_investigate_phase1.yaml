workflow:
  name: l2-investigate-phase1
  description: >
    Phase 1 of the Conductor migration: poll one real ticket, investigate it
    with the XStudio-aware XS Builder compiler as the default table-read path,
    produce a structured proposed response + investigation ledger, then release
    the claim without publishing. The live Kanban pipeline remains unaffected.
  entry_point: poll_ticket

  runtime:
    provider: openai
    type: openai
    wire_api: completions
    base_url: http://100.111.69.102:1235/v1
    api_key: lm-studio
    default_model: qwopus3.5-9b-coder
    # Keep the workflow API request conservative even if the interactive LM
    # Studio preset is currently 0.8. Ticket diagnosis benefits from repeatable
    # evidence use; change this only from outcome benchmarks, not UI parity.
    temperature: 0.2
    mcp_servers:
      l2-investigation:
        type: stdio
        command: /mnt/c/Python314/python.exe
        args: ["/mnt/c/Users/Admin/Documents/Office/AIHelpdesk/Model_Bench/l2_investigation_mcp_server.py"]
        env:
          MSSQL_MCP_SERVER: "10.2.6.204"
          XSBUILDER_CONNECTION: "${XSBUILDER_CONNECTION}"
          XSBUILDER_CLI: "${XSBUILDER_CLI:-xsb}"
        tools: ["*"]

  context:
    mode: explicit

  limits:
    max_iterations: 20
    timeout_seconds: 900

tools:
  - l2-investigation__suggest_tables
  - l2-investigation__query_table
  - l2-investigation__find_sql_objects
  - l2-investigation__get_sql_object_definition
  - l2-investigation__search_solutions
  - l2-investigation__execute_sql

agents:
  - name: poll_ticket
    type: script
    description: "Atomically claim one real eligible ticket (deterministic, no LLM)."
    command: /mnt/c/Python314/python.exe
    args:
      - "/mnt/c/Users/Admin/Documents/Office/AIHelpdesk/Hermes_Orchestrator.py"
      - "--poll"
      - "--eligible-status"
      - "Enter"
      - "--server"
      - "10.2.6.204"
    timeout: 60
    output:
      status:
        type: string
      run_id:
        type: string
        nullable: true
      ticket_id:
        type: string
        nullable: true
      ticket:
        type: object
        nullable: true
    routes:
      - to: investigate
        when: "{{ poll_ticket.output.status == 'CLAIMED' }}"
      - to: $end

  - name: investigate
    type: agent
    input:
      - "poll_ticket.output"
    tools:
      - l2-investigation__suggest_tables
      - l2-investigation__query_table
      - l2-investigation__find_sql_objects
      - l2-investigation__get_sql_object_definition
      - l2-investigation__search_solutions
      - l2-investigation__execute_sql
    system_prompt: |
      You investigate one XStudio Helpdesk L2 ticket from real evidence.

      DATABASE BOUNDARY
      You may investigate ONLY XStudio_Helpdesk and XStudio_Xbatch. Do not ask
      for or invent another database.

      NORMAL DATA-READ PATH
      1. Use suggest_tables when you do not already know the relevant table.
      2. Use query_table for ordinary reads. Supply explicit columns and
         structured filters/order_by; never write a WHERE clause yourself.
         XS Builder live-discovers the requested table and validates every
         column before compiling the SELECT.
      3. Always pass this ticket's run_id to query_table so evidence is audited.
      4. Use execute_sql only when the evidence genuinely requires a JOIN or
         aggregate that query_table cannot express. It is a read-only fallback,
         not the default query tool.

      SQL OBJECTS / EXISTING LOGIC
      find_sql_objects and get_sql_object_definition let you inspect real
      stored procedures/views/triggers. Do not trust an object's name as proof
      of its behavior. search_solutions checks existing Helpdesk solution
      articles before re-deriving a known fix.

      Never assert a database fact you have not actually queried. If
      ProblemCategory/SourceSystem/SuspectedCause/ExtractedEntitiesJson are
      populated on the ticket, use them as investigation hints, not as proof.

      When done, response_type must be one of:
      UPDATE, QUESTION, RESOLUTION, L3_ESCALATION, NEEDS_HUMAN_ACTION.
      RESOLUTION requires evidence for the actual fix. L3_ESCALATION means you
      could not diagnose/solve it. NEEDS_HUMAN_ACTION means you diagnosed it
      and know what must be done, but a human must execute the action.

      investigation_ledger must be a structured record of actual evidence:
      tables_queried, key_values_found, ruled_out, conclusion. Do not invent a
      query or result that is absent from your tool calls.
    prompt: |
      Ticket: {{ poll_ticket.output.ticket.TicketNo }}
      Run ID: {{ poll_ticket.output.run_id }}
      Full ticket context:
      {{ poll_ticket.output.ticket | tojson }}

      Investigate this ticket now using your tools, then produce your
      structured findings.
    output:
      response_type:
        type: string
        enum: ["UPDATE", "QUESTION", "RESOLUTION", "L3_ESCALATION", "NEEDS_HUMAN_ACTION"]
      reply_text:
        type: string
        minLength: 10
      problem_summary:
        type: string
        nullable: true
      findings:
        type: string
        nullable: true
      root_cause:
        type: string
        nullable: true
      resolution:
        type: string
        nullable: true
      investigation_ledger:
        type: object
    retry:
      max_attempts: 2
      max_parse_recovery_attempts: 3
    routes:
      - to: release_claim

  - name: release_claim
    type: script
    input:
      - "poll_ticket.output"
    description: >
      Phase 1 never publishes. Release the claim cleanly instead of leaving it
      for stale recovery; proposed response/ledger remain workflow output.
    command: /mnt/c/Python314/python.exe
    args:
      - "/mnt/c/Users/Admin/Documents/Office/AIHelpdesk/Hermes_Orchestrator.py"
      - "--fail-run"
      - "--run-id"
      - "{{ poll_ticket.output.run_id }}"
      - "--error-message"
      - "Phase 1 Conductor test run -- not yet wired to publish. See investigation_ledger in workflow output."
      - "--retry-after-minutes"
      - "1"
      - "--server"
      - "10.2.6.204"
    timeout: 30
    routes:
      - to: $end

output:
  status: "{{ poll_ticket.output.status }}"
  ticket_id: "{{ poll_ticket.output.ticket_id }}"
  response_type: "{% if investigate is defined %}{{ investigate.output.response_type }}{% else %}null{% endif %}"
  reply_text: "{% if investigate is defined %}{{ investigate.output.reply_text }}{% else %}null{% endif %}"
  investigation_ledger: "{% if investigate is defined %}{{ investigate.output.investigation_ledger }}{% else %}null{% endif %}"
