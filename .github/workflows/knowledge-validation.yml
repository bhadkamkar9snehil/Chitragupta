name: Knowledge validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate knowledge manifest and deployable skill references
        run: python Model_Bench/validate_knowledge_manifest.py

      - name: Run deterministic KB retrieval regression tests
        run: python Model_Bench/test_kb_retrieval.py
