model:
  default: qwen/qwen3.5-9b
  provider: lmstudio
  base_url: http://100.111.69.102:1235/v1
  context_length: 65600
agent:
  reasoning_effort: minimal
  disabled_toolsets:
    - memory
    - session_search
    - skills
memory:
  provider: ''
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true
skills:
  write_approval: true
approvals:
  deny:
    - '*sqlcmd*-q*update*'
    - '*sqlcmd*-q*insert*'
    - '*sqlcmd*-q*delete*'
    - '*sqlcmd*update *set*'
    - '*sqlcmd*insert *into*'
    - '*sqlcmd*delete *from*'
    - '*.execute(*update *'
    - '*.execute(*insert *'
    - '*.execute(*delete *'
    - '*cursor.execute*update*'
    - '*cursor.execute*insert*'
    - '*cursor.execute*delete*'
    - '*sqlcmd*'
    - '*Hermes_Orchestrator.py*'
    - '*/mnt/c/Python314/python.exe*'
    - '*python.exe*'
    - '*pip install*'
    - '*pip3 install*'
    - '*python -m pip*'
    - '*python3 -m pip*'
    - '*uv pip*'
plugins:
  enabled:
    - xstudio-l2-trace
    - xstudio-l2-orchestrator
    - xstudio-l2-tools
    - xstudio-l2-identity
    - xstudio-l2-learning
    - xstudio-l2-actions
kanban:
  dispatch_in_gateway: false
onboarding:
  seen:
    tool_progress_prompt: true
_config_version: 40
platforms:
  api_server:
    host: 0.0.0.0
    port: 8647
platform_toolsets:
  cli:
    - clarify
    - cronjob
    - delegation
    - file
    - kanban
    - terminal
    - todo
    - xstudio_l2
    - l2_learning
    - l2_actions
known_plugin_toolsets:
  cli:
    - a2a
    - spotify
    - xstudio_l2
    - l2_learning
    - l2_actions
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
tools:
  tool_search:
    enabled: off
