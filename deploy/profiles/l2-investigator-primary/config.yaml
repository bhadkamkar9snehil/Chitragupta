approvals:
  deny:
    - '*sqlcmd*-q*update*'
    - '*sqlcmd*-q*insert*'
    - '*sqlcmd*-q*delete*'
    - '*sqlcmd*update *set*'
    - '*sqlcmd*insert *into*'
    - '*sqlcmd*delete *from*'
    - '*.execute(*update *'
    - '*.execute(*insert *'
    - '*.execute(*delete *'
    - '*cursor.execute*update*'
    - '*cursor.execute*insert*'
    - '*cursor.execute*delete*'
    - '*sqlcmd*'
    - '*Hermes_Orchestrator.py*'
    - '*/mnt/c/Python314/python.exe*'
