model:
  default: qwen/qwen3.5-9b
  provider: lmstudio
  base_url: http://100.111.69.102:1235/v1
  context_length: 65600
agent:
  reasoning_effort: minimal
  disabled_toolsets:
    - memory
    - session_search
    - skills
    - terminal
    - file
    - web
    - browser
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - todo
memory:
  provider: ''
  memory_enabled: false
  user_profile_enabled: false
plugins:
  enabled:
    - xstudio-l2-tools
kanban:
  dispatch_in_gateway: false
onboarding:
  seen:
    tool_progress_prompt: true
_config_version: 40
mcp_servers:
  gbrain:
    command: "gbrain"
    args:
      - "serve"
    env:
      GBRAIN_HOME: "/home/snehil/.hermes/xstudio-gbrain"
    connect_timeout: 60.0
    enabled: true
    tools:
      include:
        - "get_brain_identity"
        - "search"
        - "query"
        - "list_pages"
        - "get_page"
        - "get_chunks"
        - "get_links"
        - "get_backlinks"
        - "get_timeline"
        - "traverse_graph"
        - "recall"
        - "get_health"
        - "get_stats"
        - "find_experts"
        - "find_orphans"
        - "find_anomalies"
        - "get_recent_salience"
        - "find_trajectory"
platforms:
  api_server:
    host: 0.0.0.0
    port: 8644
  whatsapp:
    enabled: true
platform_toolsets:
  cli:
    - kanban
    - xstudio_l2
  whatsapp:
    - kanban
    - xstudio_l2
tools:
  tool_search:
    enabled: off
